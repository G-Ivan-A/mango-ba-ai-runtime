# Closed runtime vocabulary for product-knowledge routing. A task may enable a
# subset, but every level must be declared in .hub-profile.json. Unconfigured
# levels are `out_of_slice`; ST-5-LOCAL becomes available after KB provisioning.
vocabulary: source-tiers
closed: true
version: "0.4"

evidence_forms:
  - id: EF-INLINE
    meaning: source text is attached to the task
    required_fields: [locator, content]
  - id: EF-QUOTE
    meaning: source is retrieved and recorded as a verbatim quote with timestamp
    required_fields: [locator, quote, retrieved_at]

tiers:
  - id: ST-1-CORPORATE
    name: Корпоративный репозиторий актуальной БЗ
    evidence_form: EF-QUOTE
    priority: 1
    default_status: out_of_slice
    status: out_of_slice
    rationale: основной источник после настройки URL и доступа
  - id: ST-2-CONFLUENCE
    name: Confluence проекта
    evidence_form: EF-QUOTE
    priority: 2
    default_status: out_of_slice
    status: out_of_slice
    rationale: используется после настройки space URL и доступа
  - id: ST-3-MANGO-WEB
    name: Публичные веб-ресурсы Манго
    evidence_form: EF-QUOTE
    priority: 3
    default_status: out_of_slice
    status: out_of_slice
    rationale: публичная продуктовая документация Манго
  - id: ST-4-EXTERNAL
    name: Внешние системы
    evidence_form: EF-QUOTE
    priority: 4
    default_status: out_of_slice
    status: out_of_slice
    rationale: используется только по явному разрешению задачи
  - id: ST-5-LOCAL
    name: Локальная резервная копия
    evidence_form: EF-QUOTE
    priority: 5
    default_status: out_of_slice
    status: out_of_slice
    path: docs/kb
    rationale: содержимое БЗ не входит в поставку; после отдельного наполнения используется как запасной вариант, а не замена уровней 1–4
  - id: ST-0-ATTACHED
    name: Материал текущей задачи
    evidence_form: EF-INLINE
    priority: 0
    default_status: available
    status: available
    rationale: исходный текст, ссылка или файл пользователя
  - id: ST-6-HUMAN
    name: Ответ Заказчика на G-human
    evidence_form: EF-INLINE
    priority: 6
    default_status: available
    status: available
    rationale: эскалация после документированной неудачи поиска

allowed_statuses: [available, out_of_slice]
order: [ST-0-ATTACHED, ST-1-CORPORATE, ST-2-CONFLUENCE, ST-3-MANGO-WEB, ST-4-EXTERNAL, ST-5-LOCAL, ST-6-HUMAN]

escalation_rule: >-
  Проверять доступные уровни по порядку. Пропускать out_of_slice с записью
  причины. Если уровни 1–5 не дали доказательства, записать попытки в лист
  прогона и перейти к ST-6-HUMAN через G-human. Не выдавать гипотезу за факт.

conflict_rule: >-
  При расхождении выигрывает источник более высокого приоритета; внутри уровня
  — более свежий. Конфликт, который нельзя разрешить, передаётся G-human.
