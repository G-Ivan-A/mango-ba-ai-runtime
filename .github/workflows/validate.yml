name: Validate runtime repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run runtime smoke test
        run: sh tests/runtime-smoke.sh
      - name: Validate knowledge base navigation
        run: python -m unittest discover -s tests -p 'test_kb_navigation.py'
