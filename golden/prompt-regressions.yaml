# Регрессионные кейсы чистоты промптов (И-12 реестра справочников спицы
# промптов; задача РТ-9).
#
# Промпты спицы держат принцип без кейса: пример с конкретной системой,
# продуктом или задачей привязывал бы общий шаг к одному случаю. Кейсы, которые
# стояли в тексте промптов, перенесены сюда: они не читаются промптом, а
# проверяют, что модель исполняет принцип на конкретном входе. Регистр кейсов
# спицы (CR-01…CR-04) ссылается на эти id по закреплённому SHA.
#
# Набор не участвует в машинном гейте маршрута RG-BCREQ-v1: G-mach читает только
# golden/cases*.yaml. Все кейсы synthetic: вход описан словами, клиентских
# данных и стенограмм здесь нет.
#
# Поля кейса:
#   register    — id кейса в регистре спицы
#   steps       — шаги, где принцип исполняется
#   principle   — принцип в формулировке промпта (без имён систем и продуктов)
#   case        — бывший кейс из текста промпта (вход прогона)
#   expect      — что прогон обязан сделать
#   reject      — вывод, который прогон обязан отвергнуть
golden_set: prompt-regressions
version: "1.0"
origin: synthetic
confirmed_by: none
cases:
  - id: PR-01
    register: CR-02
    steps: "A-IN (общий контракт, блок «Доказательная нормализация и фактический доступ»); Ш-0…Ш-2"
    principle: >-
      Наблюдаемое поведение внешней системы (например, задержка появления
      записи) не доказывает способ интеграции, тайминг SLA или переносимость на
      другую систему.
    case: >-
      Во входе сказано, что запись звонка появляется в amoCRM с задержкой.
      Других доказательств о способе привязки нет.
    expect: >-
      Способ API-привязки по ID, тайминг SLA и возможность другой CRM остаются
      неизвестными: ACCESS_GAP или [ТРЕБУЕТСЯ УТОЧНЕНИЕ] с описанием
      выполненного поиска; оценка исполнимости не выставляется без
      доказательства.
    reject: >-
      «Интеграция привязывает запись по ID через API», «SLA — равен наблюдаемой
      задержке», «то же будет работать с любой CRM».
  - id: PR-02
    register: CR-01
    steps: "AIN-06 (цель, why маршрута, контрпример инструкции); Ш-2"
    principle: >-
      Новизна решения не отменяет дельту существующих подсистем, интерфейсов и
      настроек; исключённый компонент с зависимостью остаётся в графе.
    case: >-
      Задача — новый коннектор к внешней CRM. Коннектор настраивается в личном
      кабинете (ЛК), права и параметры подключения хранит ЛК.
    expect: >-
      В графе компонентов есть новый коннектор и дельта ЛК (интерфейс настройки,
      права доступа, параметры) со статусом candidate и источником связи;
      исключённый из scope компонент с зависимостью остаётся в графе.
    reject: >-
      «Коннектор новый, значит существующие подсистемы не меняются», удаление
      ЛК из графа, пометка исключённого компонента как противоречия.
  - id: PR-03
    register: CR-03
    steps: "AIN-12 (контрпример инструкции); Ш-1"
    principle: >-
      Аналогия с другой системой не доказывает полный сценарий в целевой
      системе; нет доказательства — не «Нет».
    case: >-
      В базе знаний есть описание интеграции с amoCRM; задача — тот же
      сценарий для HDE. Прямой цитаты о HDE нет.
    expect: >-
      Исполнимость сценария в HDE не выставляется по аналогии: шаги сценария
      без доказательства помечены как неизвестные (ACCESS_GAP) с перечнем
      недостающих доказательств.
    reject: >-
      «Да» по исполнимости полного сценария HDE на основании описания amoCRM;
      «Нет» при отсутствии доказательства.
  - id: PR-04
    register: CR-04
    steps: "A-IN (общий контракт, правило АД-8 «Область доказательства»); Ш-2 (стыки продуктов)"
    principle: >-
      Наличие функции в продукте не доказывает её доступность в конкретной
      интеграции, модуле или тарифе; список функций одной стороны стыка не
      подтверждает передачу этих функций через интеграцию.
    case: >-
      В описании ВАТС есть запись разговоров. Задача — передавать записи в
      amoCRM через коннектор; клиент на базовом тарифе. Об этой функции в
      описании коннектора и тарифа ничего нет.
    expect: >-
      Доступность записи через коннектор и на базовом тарифе не выставляется
      по описанию продукта: каждая сторона стыка подтверждается отдельно,
      неподтверждённая — вопрос, ACCESS_GAP или [ТРЕБУЕТСЯ УТОЧНЕНИЕ];
      «не описано» не смешивается с «явно не поддерживается».
    reject: >-
      «Коннектор передаёт записи, раз ВАТС их пишет», «на базовом тарифе
      функция доступна», «Нет» при отсутствии описания.
