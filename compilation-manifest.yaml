# Манифест компиляции: что физически скопировано, что преобразовано в
# машиночитаемую форму, что отброшено как избыточное для времени выполнения.
# Манифест — единственное место пакета, где источник модели упоминается как
# источник. Ни один артефакт времени выполнения на источник не ссылается
# (контракт 2).
#
# Источник модели — ba-ai-metamodel: проект метамодели вынесен из Хаба
# hybrid-Intelligence-lab с историей (контракт выноса E1–E6, ba-ai-metamodel#1).
# Закрепление переведено на коммит нового репозитория без перекомпиляции
# (Ш3.5, B-248 Хаба): по карте коммитов импорта
# docs/import/hub-54face1618f7/commit-map.txt коммит 657abcc — тот же снимок,
# что main Хаба b3a9e16 после PR #720, все 324 файла источника побайтно
# совпадают; норма PT-5 — коммит 42e8c1b (в Хабе de68984).
#
# 0.8 (BL-192 спицы, RFC-RT-002 Р-RT-2…Р-RT-4): универсальный контекст агента
# без перекомпиляции — source_commit и compiled_at не меняются, нормативное
# содержание источника модели не тронуто. Зеркало навыков .agents/skills/ и
# правки AGENTS.md (ACCESS_GAP, поиск в docs/kb) записаны в transformed.
manifest: execution-package-mvp-bcreq
version: "0.8"
meta_model_version: "0.5"
compiled_at: 2026-11-04
source_ssot: https://github.com/G-Ivan-A/ba-ai-metamodel
source_commit: 657abccc171d1ad6d860bbc262b5cc56aa5e99e0   # = Хаб b3a9e161c9fb459cb9112d3aaa4d003bbfb5c4fa
target_spoke: mango-ba-ai-runtime
slice: "A-IN → A-CORE → A-BCREQ, продуктовый класс contact-center, процессы P-01, P-02, P-03"

# Репозиторий не знает о средах и вариантах развёртывания: БА ссылается на
# него в чате модели. Пакет содержит физические копии всего необходимого.
deployment:
  mechanism: ссылка на репозиторий (или вставка его файлов) в чате модели
  result: "AGENTS.md, skills/, .agents/skills/ (зеркало skills/), taxonomy/, contracts/, routes/, templates/, golden/, evaluation/, docs/kb/, docs/guides/"
  hub_access_required_at_runtime: false

# 1. Скопировано физически: содержание перенесено в пакет дословно или с
#    сокращением до применимого, без изменения смысла.
copied:
  - what: закрытые словари классов артефактов, процессов, операций и продуктов
    from: таксономии Хаба (мета-модель, таксономия процессов, таксономия операций, продуктовый справочник)
    to: [taxonomy/artifacts.yaml, taxonomy/processes.yaml, taxonomy/operations.yaml, taxonomy/products.yaml]
    note: перенесены все значения словарей; принадлежность срезу отмечена флагом in_slice, а не усечением словаря
  - what: перечень слотов, классов формата, проекций и продуктовых профилей
    from: исследование микроструктуры артефактов требований
    to: [contracts/c-out-bcreq.md, templates/bcreq-skeleton.md]
  - what: смежные термины домена контакт-центра с основанием смешения
    from: словарь домена и материалы кросс-валидации
    to: taxonomy/domain-glossary.yaml
  - what: смежные термины доменов voice-ucaas и analytics-reporting с основанием смешения (РТ-4)
    from: база знаний docs/kb (руководство ЛК, API ВАТС, API сервиса интеграций, Mango Talker, интеграции amoCRM, Битрикс24, 1С) и каталог taxonomy/mango-products.yaml
    to: [taxonomy/domain-glossary-voice-ucaas.yaml, taxonomy/domain-glossary-analytics-reporting.yaml]
    note: >-
      форма записи — как у словаря contact-center; значения выписаны из
      разделов базы знаний без добавления смысла, у каждого термина указаны
      sources (разделы docs/kb) и catalog (узлы каталога класса). Спица —
      SSOT значений словаря домена: перенос этих значений в спицу — решение
      владельца
  - what: уровни источников знания, формы доказательства и правило разрешения конфликта источников
    from: исследование извлечения знания (лестница готовности корпуса, матрица стратегий, приоритет модификаторов)
    to: taxonomy/source-tiers.yaml
    note: >-
      runtime объявляет пять обязательных уровней задачи: корпоративная БЗ,
      Confluence, веб Манго, внешние системы и локальный fallback; уровень,
      недоступный модели, пропускается с записью причины и работу не блокирует
  - what: состав и формулировочные правила проекций документа
    from: практический раздел мета-модели (проекции как три чтения одного артефакта)
    to: taxonomy/projections.yaml
    note: >-
      существовавшие V-BIZ, V-APPROVE, V-DEV сохранены без переименования и
      дополнены V-CONTRACT (чтение для технического задания)
  - what: определения метрик M-1…M-5 и MP-1…MP-6
    from: практические разделы мета-модели и таксономии процессов
    to: evaluation/metrics.yaml
  - what: база знаний продуктов Манго
    from: https://github.com/G-Ivan-A/mango_ba_prompts/tree/main/kb/processed
    source_commit: 8cbf82aa73129ec5747af07f790aaf438b0fb6e9
    to: docs/kb
    note: копия каталога без изменений; уровень ST-5-LOCAL
  - what: каталог продуктов Mango 2026-10-28.1 (все 353 узла Domain → Capability → Feature → Atomic Function)
    from: https://github.com/G-Ivan-A/mango_ba_prompts/blob/e3597fd74da9c4f631ca46697c643462e2cf0b85/docs/taxonomy/products.json
    source_commit: e3597fd74da9c4f631ca46697c643462e2cf0b85
    to: taxonomy/mango-products.yaml
    note: >-
      копия значений каталога спицы без отбора и без изменения смысла: id,
      имена, связи и lifecycle сохранены, classes вычислены через предков по
      runtime_compatibility каталога; правило привязки atomic_function к
      каталогу (PT-5) скомпилировано отдельно, см. transformed. Хаб не
      принимает каталог спицы как источник: Source хранит собственный
      версионированный снимок значений (PT-2), поэтому каталог остаётся
      копией спицы, а не звеном цепочки Хаба. Источник — коммит спицы
      после решения Р-17 (status accepted, 74 узла added-for-review →
      accepted); РТ-6 сменил только lifecycle, catalog_status и происхождение
  - what: профили продуктов для сверки терминов — словари D1…D11, минимальный набор и словари профиля продукта (И-11, РТ-8)
    from: стандарт состава BCREQ спицы mango_ba_prompts (раздел 4 «Профили продуктов»), стандарт раздела 1 (таблица словарей) и промпт Ш-2 на коммите e051e0fa
    source_commit: e051e0fa46e22c43004a6af19e8c53b827ce1b1d
    to: taxonomy/product-profiles.yaml
    note: >-
      дословная копия значений: в промптах Ш-0 и Ш-2 остался принцип «возьми
      словари профилей задействованных продуктов», значения ушли сюда (issue
      #495 спицы). Ссылки на источники словарей не копировались: справочник
      называет словарь, порядок источников истины задаёт стандарт раздела 1
  - what: разговорные формы терминов для нормализации стенограмм (spoken_aliases, И-11)
    from: примеры промпта prompts/asr-ingestion-oneshot.md спицы mango_ba_prompts на коммите e051e0fa
    source_commit: e051e0fa46e22c43004a6af19e8c53b827ce1b1d
    to: taxonomy/product-profiles.yaml
    note: >-
      дословная копия пар «амо» → amoCRM и «вакс» → ВАТС; в промпте остался
      принцип и обезличенный пример формы (issue #495 спицы)
  - what: регрессионные кейсы чистоты промптов PR-01…PR-04 (И-12, РТ-9)
    from: кейсы из текста промптов и сборочных ССОТ A-IN спицы mango_ba_prompts на коммите e051e0fa (регистр кейсов CR-01…CR-04)
    source_commit: e051e0fa46e22c43004a6af19e8c53b827ce1b1d
    to: golden/prompt-regressions.yaml
    note: >-
      кейс — вход прогона, принцип остался в промпте; набор synthetic, в
      G-mach не входит (G-mach читает golden/cases*.yaml)

# 2. Преобразовано: нормативный текст стал структурой, которую исполняет
#    скрипт, а не читает человек.
transformed:
  - what: контракты C-IN, C-CORE, C-OUT, C-CL, C-RK как текстовые описания
    to: contracts/*.md
    form: системный промпт-контракт; имя до точки и структура полей сохранены из JSON Schema версии 0.4
  - what: описание маршрута P-01 → P-02 → P-03 прозой
    to: routes/rg-bcreq-v1.yaml
    form: граф узлов и рёбер с предикатами перехода
  - what: правила SK-0…SK-10 (структура навыка)
    to: skills/*.md
    form: шесть обязательных разделов и frontmatter с полями name и description
  - what: правила гейтов GT-1…GT-6 и порядок G-self → G-mach → G-human
    to: [evaluation/g-mach-checklist.md, evaluation/g-human-checklist.md, evaluation/validate-package.md]
    form: системный промпт G-mach (из validate-package.py версии 0.4, порядок проверок сохранён) и отмечаемый список для человека
  - what: правила Golden Set EP-G1…EP-G7
    to: golden/cases.yaml
    form: индекс случаев с ожиданиями, отбираемый машинным гейтом без чтения markdown
    note: >-
      EP-G7 переведено в исполняемый вид: каждая пара confusable_with словаря
      домена обязана иметь отрицательный случай, что проверяется валидатором
  - what: правило PT-5 (функция продукта на входе — закрытое значение каталога)
    to: [taxonomy/products.yaml, contracts/c-in.md, AGENTS.md, skills/transcript-normalization-contact-center.md, evaluation/validate-package.md, evaluation/g-mach-checklist.md]
    form: >-
      поля catalog и class_domains словаря продуктов; условие c-in.products[]
      и отказ шага check-schema узла n1; проверки формы каталога в
      check_taxonomies и класса и функции каждого случая в check_golden для
      каждого golden/cases*.yaml (недопустимое значение входа —
      declared_function с catalog_check, а не atomic_function)
  - what: Golden Set по продуктовым классам с привязкой к каталогу (РТ-3, RFC-RT-001)
    to: [golden/cases.yaml, golden/cases-voice-ucaas.yaml, golden/cases-analytics-reporting.yaml]
    form: индекс на класс; у каждого случая product_class и atomic_function — функция каталога taxonomy/mango-products.yaml с классом набора
    note: >-
      все случаи synthetic с confirmed_by none и применяются структурно до
      подтверждения человеком. Недопустимое значение входа отрицательного
      случая «функция вне каталога / чужого класса» записано в
      declared_function, проверка — catalog_check. check_golden проверяет все
      наборы golden/cases*.yaml; наборы классов вне среза (in_slice: false) —
      данные для промптов спицы и структурной сверки, отказывающий пакет —
      refusing_pack узла маршрута
  - what: правила следа EP-R4, EP-R8 и лист прогона
    to: [routes/run-sheet-template.yaml, contracts/c-rk.md]
    form: append-only перечень событий и проекция передачи работы
  - what: навыки skills/<имя>.md в раскладке, которую клиенты находят сами (RFC-RT-002, Р-RT-3 B)
    to: .agents/skills/<имя>/SKILL.md
    form: >-
      генерируемая побайтная копия каждого skills/<имя>.md
      (tests/build_skills_mirror.py), сверка sha256 в
      tests/test_skills_mirror.py и tests/runtime-smoke.sh; skills/ остаётся
      единственным источником, зеркало вручную не правится
  - what: запись причины для недоступного уровня источников и маршрут поиска в базе знаний (RFC-RT-002 §4.1, Р-RT-2)
    to: AGENTS.md
    form: >-
      правило 10 называет запись причины маркером
      `ACCESS_GAP: <что> — <почему>` (недоступный, платный или внешний
      источник; содержание не выводится) и отличает его от unverified;
      раздел «Поиск в базе знаний» повторяет маршрут docs/kb/USAGE.md
      (MAP.json → sections_toc → sections → retrieval_if_insufficient).
      Источник — норма taxonomy/source-tiers.yaml («пропускается с записью
      причины») и docs/kb/USAGE.md (РТ-7); нормативного текста AGENTS.md в
      ba-ai-metamodel нет (проверено на e1f67e2), новое правило не вводится

# 3. Отброшено: во время выполнения не используется. Отбрасывание —
#    сознательное решение компиляции, а не пропуск (Анти-Инфляция).
discarded:
  - what: исследовательские тексты модулей (00-*, 10-*, 20-*, 30-*, 40-*, 50-*)
    why: нормативные следствия из них уже вынесены в правила навыков и схемы; копия текста удваивала бы источник истины
  - what: журналы прогонов и черновики запросов к моделям
    why: материал получения правил, а не сами правила
  - what: 20 из 31 операции и 22 из 33 навыков таксономии
    why: маршрут среза их не проходит; словари сохранены целиком, скомпилированы только применимые (Анти-Инфляция)
  - what: процессы P-04…P-10 и классы артефактов A-FR, A-TZ, A-US, A-UC, A-SPEC, A-DIAG, A-REP
    why: за границей вертикального среза MVP; внесены в бэклог масштабирования
  - what: организационные материалы Хаба (карта артефактов, бэклог, история решений)
    why: управляют развитием модели, а не исполнением маршрута
  - what: срез под конкретную среду исполнения (.hub-profile.json, tools/, runs/, experiments/)
    why: >-
      репозиторий не привязан к среде и варианту развёртывания; навыки
      перенесены в skills/, валидатор — в промпт evaluation/validate-package.md.
      .agents/skills/ больше не срез среды: с 0.8 это зеркало skills/ в
      открытой раскладке навыков (см. transformed), без файлов конкретного
      клиента

# Обратная связь: ba-ai-metamodel — SSOT развивающейся модели (после выноса
# из Хаба). Расхождение, обнаруженное в спутнике, исправляется задачей
# ba-ai-metamodel и новой компиляцией, а не правкой копии в спутнике.
feedback:
  rule: правка нормативного содержания в спутнике — дефект процесса
  channel: задача в ba-ai-metamodel с указанием артефакта пакета и наблюдения из прогона
  recompilation: смена source_commit и compiled_at во всех затронутых файлах
